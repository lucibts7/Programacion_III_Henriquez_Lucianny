<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello CSS</title>
    <style>
        h2 {
            color: rgb(255, 127, 255);
        }
        p{
            color: rgb(209, 68, 245);
        }
    </style>
    <link rel="stylesheet" href="01_hello_css.css">
</head>
<body>
    <h1>Maneras de incluir Estilos CSS en un archivo HTML</h1>
    <h1 style="color: rgb(72, 147, 233)">Hello World con CSS - Tipo Inline</h1>
    <h2> Estilo CSS - Interno</h2>
    <p>Esta es la manera de incluir estilos CSS tipo interno, colocando los estilos en el head del HTML.</p>
    <h3>Estilo CSS - Externo</h3>
    <a>Se incluyó estilo a través de un archivo externo</a>
</body>
</html>
