<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transiciones - Estacionamiento Digital</title>
    <link rel="stylesheet" href="18_transiciones_mp_henriquez_lucianny.css">
</head>
<body>
    <main>
        <h1>Autor: Lucianny Henriquez</h1>
        <h1>Movimiento de vehículos</h1>
        <div class="vehiculo">
            <div class="opcion">Automóvil</div>
        </div>
        <div class="vehiculo2">
            <div class="opcion2">Motocicleta</div>
        </div>
        <div class="alerta">
            <div class="opcion">Vehículo</div>
        </div>
        <h1>Control del estacionamiento</h1>
        <p>Coloca el cursor sobre el botón</p>
        <button class="boton-consulta">
            Consultar disponibilidad
        </button>
        <div class="autos">
            <h2>Automóviles</h2>
            <p>Espacios de estacionamiento</p>
        </div>
    </main>
    <br>
    <br>
    <h1>Zona de estacionamiento</h1>
    <div class="zona">
        <div class="vehiculo">Automóvil</div>
    </div>
    <h1>Indicador de acceso</h1>
    <div class="radar">
        <div class="indicador">➤</div>
    </div>
    <h1>Movimiento en el estacionamiento</h1>
    <div class="zona2">
        <div class="vehiculo2">Vehículo</div>
    </div>
</body>
</html>
